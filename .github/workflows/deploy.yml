name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to push the built site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The site is served from the custom domain in public/CNAME, so it lives at the root ("/").
      - name: Build
        run: npm run build

      # GitHub Pages has no SPA fallback; serving index.html as 404.html lets deep links like /privacy load.
      # .nojekyll stops Pages from running Jekyll over the built files.
      - name: Prepare site
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # Publishing to a gh-pages branch turns Pages on automatically the first time.
      - name: Publish to gh-pages
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
