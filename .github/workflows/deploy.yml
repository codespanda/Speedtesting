name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Neither job needs the token saved in git config; deploy passes its own when pushing.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # Tests the production build (with its Content-Security-Policy). Cloudflare is mocked,
      # so this needs no network access to speed.cloudflare.com.
      - name: Run end-to-end tests
        run: npm run test:e2e:prod

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    # Only ship from main, and only when the tests pass.
    needs: e2e
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the built site to the gh-pages branch.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Neither job needs the token saved in git config; deploy passes its own when pushing.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # No package install scripts in the job that holds a write token.
      - run: npm ci --ignore-scripts

      # The site is served from the custom domain in public/CNAME, so it lives at the root ("/").
      - name: Build
        run: npm run build

      # The build writes an HTML file per page plus 404.html (see the seo plugin in vite.config.ts).
      # .nojekyll stops Pages from running Jekyll over the built files.
      - name: Prepare site
        run: touch dist/.nojekyll

      - name: Publish to gh-pages
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
